[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 15 }
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../" }]

[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
l1   = "${L1_RPC_URL}"

[etherscan]
fuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }
